services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  maintenance:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m app.maintenance_worker"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:-http://api:8000}
      BOT_PUBLIC_SUB_BASE_URL: ${BOT_PUBLIC_SUB_BASE_URL:-${PUBLIC_BASE_URL}}
      BOT_ADMIN_USERNAME: ${BOT_ADMIN_USERNAME:-${ADMIN_USERNAME}}
      BOT_ADMIN_PASSWORD: ${BOT_ADMIN_PASSWORD:-${ADMIN_PASSWORD}}
      BOT_REQUEST_TIMEOUT_SECONDS: ${BOT_REQUEST_TIMEOUT_SECONDS:-30}
      BOT_TRAFFIC_REFRESH: ${BOT_TRAFFIC_REFRESH:-true}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
